name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      accounting-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gp_launch_test
          POSTGRES_PASSWORD: isolated_fixture
          POSTGRES_DB: gp_launch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gp_launch_test -d gp_launch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Mark start
        run: echo "CI_STARTED_AT_MS=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Unit tests
        run: yarn test:unit
      - name: Production smoke amount parser tests
        run: node --test src/scripts/lib/__tests__/positive-cart-totals.test.mjs
      - name: Public catalog database and guard tests
        env:
          CATALOG_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
        run: yarn test:catalog
      - name: Contact transaction and migration identity tests
        env:
          CONTACT_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
          TEST_TYPE: integration:contacts
        run: yarn jest --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Accounting transaction and delivery tests
        run: yarn test:accounting
        env:
          QBD_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
      - name: Confirmed incoming-stock transactions
        run: yarn test:incoming-stock
        env:
          INCOMING_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
      - name: Receipt email transactions and immutable recipients
        run: TEST_TYPE=integration:receipt-email yarn jest --runInBand
        env:
          RECEIPT_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
      - name: Immutable order promise transactions
        run: TEST_TYPE=integration:order-promise yarn jest --runInBand
        env:
          ORDER_PROMISE_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
      - name: Local milestone transaction and history tests
        run: TEST_TYPE=integration:local-milestones yarn jest --runInBand
        env:
          LOCAL_MILESTONE_TEST_DATABASE_URL: postgres://gp_launch_test:isolated_fixture@127.0.0.1:5432/gp_launch
      - name: Emit ops.ci
        if: always()
        env:
          JITSU_HOST: ${{ secrets.JITSU_HOST }}
          JITSU_SERVER_SECRET: ${{ secrets.JITSU_SERVER_SECRET }}
          CI_CONCLUSION: ${{ job.status }}
        run: node .github/scripts/emit-ops-ci.mjs
